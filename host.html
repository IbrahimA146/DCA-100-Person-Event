<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e6d3">
  <meta name="robots" content="noindex">
  <title>Tea &amp; Coffee Night · Host</title>
  <link rel="icon" type="image/png" href="logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap&text=0123456789">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="host-wrap">
    <section class="card">
      <img class="logo" src="logo.png" width="132" height="132" alt="Dialogue Student Association, University of Texas">
      <h1>Tea <em>&amp;</em> Coffee Night</h1>
      <p class="lede poster-lede">Scan to sign in and find your group</p>
      <div class="qr" id="qr"></div>
      <p class="url" id="url"></p>
      <button class="primary no-print" id="print" type="button">Print this sign</button>
    </section>

    <section class="card no-print">
      <p class="eyebrow">Host view <span class="status" id="status">Connecting</span></p>
      <p class="count" id="count">&ndash;</p>
      <p class="count-label">signed in</p>

      <div class="stepper">
        <span class="eyebrow">Groups</span>
        <button id="fewer" type="button" aria-label="One group fewer">&minus;</button>
        <output id="groups"></output>
        <button id="more" type="button" aria-label="One more group">+</button>
      </div>
      <p class="split" id="split"></p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const STORE = "tcn:host-groups";
    const cfg = TCN.config;
    const $ = (id) => document.getElementById(id);

    function remembered() {
      try {
        return TCN.clampGroups(localStorage.getItem(STORE));
      } catch {
        return null;
      }
    }

    let picked = remembered(); // the number on the stepper
    let state = null; // { session, groups }: what guests' phones are going by
    let count = null;

    function drawQr() {
      const url = new URL("./", location.href).href;
      $("url").textContent = url.replace(/^https?:\/\//, "");
      if (typeof qrcode !== "function") {
        $("qr").textContent = "The QR code couldn't load. Check the connection and refresh.";
        return;
      }
      const qr = qrcode(0, "M");
      qr.addData(url);
      qr.make();
      $("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
    }

    function render() {
      const live = state ? state.groups : 0;
      if (picked === null && live >= TCN.MIN_GROUPS) picked = live;
      const shown = picked || TCN.clampGroups(cfg.groups) || 10;

      $("count").textContent = count === null ? "–" : count;
      $("groups").textContent = shown;
      $("fewer").disabled = shown <= TCN.MIN_GROUPS;
      $("more").disabled = shown >= TCN.MAX_GROUPS;

      // People are dealt out evenly, so sizes follow from the count alone.
      const low = Math.floor((count || 0) / shown);
      const high = Math.ceil((count || 0) / shown);
      $("split").hidden = !count;
      $("split").textContent = low === 0
        ? "Fewer people than groups so far"
        : `${shown} groups of ${low === high ? low : `${low}–${high}`}`;
    }

    // Two live lines feed this page: the state and the sign-in tally.
    const lines = {};

    function setHealth(line, up) {
      lines[line] = up;
      const down = Object.values(lines).includes(false);
      $("status").classList.toggle("down", down);
      $("status").textContent = down ? "Reconnecting" : "Live";
    }

    let stopCount = null;

    function applyState(next) {
      const moved = !state || state.session !== next.session;
      state = next;
      // A new session has its own tally; listen to that one instead.
      if (moved) {
        if (stopCount) stopCount();
        count = null;
        stopCount = TCN.watchCount(
          next.session,
          (signedIn) => {
            count = signedIn;
            render();
          },
          (up) => setHealth("count", up)
        );
      }
      render();
    }

    TCN.watchState(applyState, (up) => setHealth("state", up));

    function pick(next) {
      picked = TCN.clampGroups(next);
      try {
        localStorage.setItem(STORE, picked);
      } catch {
        // Not remembered across refreshes; everything else still works.
      }
      render();
    }

    $("fewer").addEventListener("click", () => pick(Number($("groups").textContent) - 1));
    $("more").addEventListener("click", () => pick(Number($("groups").textContent) + 1));

    drawQr();
    render();
  </script>
</body>
</html>
