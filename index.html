<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f1e6d3">
  <meta name="robots" content="noindex">
  <title>Tea &amp; Coffee Night · Find your group</title>
  <link rel="icon" type="image/png" href="logo-mark.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap&text=0123456789">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" width="132" height="132" alt="Dialogue Student Association, University of Texas">
    <h1>Tea <em>&amp;</em> Coffee Night</h1>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <g class="steam">
          <path d="M22 23c-3-3 3-5 0-9"/>
          <path d="M29 23c-3-3 3-5 0-9"/>
          <path d="M36 23c-3-3 3-5 0-9"/>
        </g>
        <path d="M14 30h30v8a14 14 0 0 1-14 14h-2a14 14 0 0 1-14-14z"/>
        <path d="M44 33h4a5 5 0 0 1 0 10h-5"/>
        <path d="M10 57h38"/>
      </svg>
    </div>

    <form id="signin" novalidate hidden>
      <p class="lede">Write your name to sign in and find your group for the evening.</p>
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="40">
      <p class="error" id="error" role="alert" hidden>Please write your name first.</p>
      <button class="primary" id="go" type="submit">Sign in</button>
      <button class="link" id="back" type="button" hidden>Back</button>
    </form>

    <!-- After signing in: first "on the list", then the group once the host announces them. -->
    <section id="signed" aria-live="polite" hidden>
      <p class="eyebrow" id="eyebrow"></p>
      <p class="guest" id="guest"></p>
      <p class="youre-in" id="lead"></p>
      <div class="ring">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <filter id="spill" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4"/>
            <feDisplacementMap in="SourceGraphic" scale="7"/>
          </filter>
          <g filter="url(#spill)" fill="none" stroke="#7a4a2b">
            <circle cx="120" cy="120" r="100" stroke-width="5" opacity="0.26"/>
            <circle cx="120" cy="120" r="94" stroke-width="1.5" opacity="0.34"/>
            <circle cx="122" cy="119" r="105" stroke-width="1" opacity="0.2"/>
          </g>
        </svg>
        <span class="ring-label" id="label"></span>
        <span class="ring-number" id="number"></span>
        <span class="ring-wait" id="wait">Steeping</span>
      </div>
      <p class="note" id="note"></p>
      <ul class="others" id="others" hidden></ul>
      <button class="link" id="another" type="button">Signing in a friend too?</button>
    </section>
  </main>

  <p class="colophon">Dialogue Student Association · UT Austin</p>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const STORE = "tcn:guests";
    const KEEP_FOR = 18 * 60 * 60 * 1000;
    const cfg = TCN.config;
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((done) => setTimeout(done, ms));

    // Everyone signed in on this phone tonight, newest last.
    function loadGuests() {
      try {
        const list = JSON.parse(localStorage.getItem(STORE));
        return Array.isArray(list) ? list.filter((guest) => Date.now() - guest.at < KEEP_FOR) : [];
      } catch {
        return [];
      }
    }

    function saveGuests() {
      try {
        localStorage.setItem(STORE, JSON.stringify(guests));
      } catch {
        // Private browsing: everything still shows, it just won't survive a refresh.
      }
    }

    let guests = loadGuests();
    let state = null; // { session, groups } once the counter has been heard from
    let adding = false; // the form is open to sign in one more person

    const announced = () => Boolean(state) && state.groups >= TCN.MIN_GROUPS;

    // `ticket` stands in for a number when the counter couldn't be reached.
    const groupOf = (guest) => TCN.groupFor(guest.number || guest.ticket, state.groups, state.session);

    function render(animate) {
      const showForm = adding || guests.length === 0;
      $("signin").hidden = !showForm;
      $("signed").hidden = showForm;
      $("back").hidden = guests.length === 0;
      if (showForm) return;

      const latest = guests[guests.length - 1];
      const known = announced();
      $("guest").textContent = latest.name;
      $("eyebrow").textContent = known ? "Welcome" : "Signed in";
      $("lead").textContent = known ? "you’re in" : "you’re on the list";
      $("label").textContent = cfg.groupLabel;
      $("number").textContent = known ? groupOf(latest) : "";
      $("label").hidden = $("number").hidden = !known;
      $("wait").hidden = known;
      $("note").textContent = known
        ? "Find your group and enjoy the evening."
        : "Your group will appear right here once everyone has arrived. No need to scan again.";

      const earlier = guests.slice(0, -1).reverse();
      $("others").replaceChildren(
        ...earlier.map((guest) => {
          const item = document.createElement("li");
          const name = document.createElement("b");
          name.textContent = guest.name;
          item.append(name, known ? ` · ${cfg.groupLabel} ${groupOf(guest)}` : " · signed in");
          return item;
        })
      );
      $("others").hidden = earlier.length === 0;

      // Restart the entrance animation when there's something new to show.
      $("signed").classList.remove("reveal");
      if (animate) {
        void $("signed").offsetWidth;
        $("signed").classList.add("reveal");
      }
    }

    TCN.watchState((next) => {
      const changed = !state || state.groups !== next.groups || state.session !== next.session;
      state = next;
      // The host started over since this phone signed in: start over here too.
      if (guests.some((guest) => guest.session !== null && guest.session !== next.session)) {
        guests = [];
        saveGuests();
      }
      if (changed) render(true);
    });

    let slowTimer;

    function setBusy(busy) {
      $("go").disabled = busy;
      $("name").readOnly = busy;
      $("go").textContent = busy ? "Steeping" : "Sign in";
      // In a rush at the door there can be a short queue for a number.
      clearTimeout(slowTimer);
      if (busy) slowTimer = setTimeout(() => ($("go").textContent = "Almost there"), 4000);
    }

    $("signin").addEventListener("submit", async (event) => {
      event.preventDefault();
      if ($("go").disabled) return;

      const name = $("name").value.trim().replace(/\s+/g, " ");
      $("error").hidden = Boolean(name);
      if (!name) {
        $("name").focus();
        return;
      }

      setBusy(true);
      const started = Date.now();

      if (!state) state = await TCN.getState(11000).catch(() => null);

      let number = null;
      if (state) {
        try {
          number = await TCN.takeNumber(state.session);
        } catch {
          // Counter unreachable. Nobody should be stuck at the door, so they
          // get a random ticket instead and are still placed in a group.
        }
      }

      guests.push({
        name,
        number,
        ticket: 1 + Math.floor(Math.random() * 1e6),
        session: number ? state.session : null,
        at: Date.now(),
      });
      saveGuests();

      await sleep(Math.max(0, 900 - (Date.now() - started)));
      setBusy(false);
      $("name").value = "";
      adding = false;
      render(true);
    });

    $("another").addEventListener("click", () => {
      adding = true;
      render(false);
      $("name").focus();
    });

    $("back").addEventListener("click", () => {
      adding = false;
      render(false);
    });

    render(false);
  </script>
</body>
</html>
